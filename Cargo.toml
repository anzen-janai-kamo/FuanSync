[package]
name = "fuansync"
version = "1.0.0"
edition = "2024"
license = "MIT-0"
description = "A Git credential helper for GitHub App installation tokens"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"

[dev-dependencies]
rand = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
